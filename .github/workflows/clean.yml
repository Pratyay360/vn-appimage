name: Clean Workflow Runs

on:
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Number of days to keep runs (0 to delete all)'
        required: false
        default: '0'
        type: string
      keep_minimum_runs:
        description: 'Minimum number of runs to keep per workflow'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: write

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.retain_days || '5' }}
          keep_minimum_runs: ${{ inputs.keep_minimum_runs || '5' }}

      - name: trash releases
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isLatest --jq '.[] | select(.isLatest | not) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" -y --cleanup-tag -R "$GITHUB_REPOSITORY"
            done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # - name: Delete old releases
      #   uses: jluo1996/delete-releases-action@v1
